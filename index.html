<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISYS Readiness Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
/* VOICE: premium, calm consultancy; confident but private, the client's own planning room
   IDEA: the ISYS network mark — nodes and links in ISYS blue, a gold thread running through
   PICTURE: deep-blue hero with a living constellation; the survey card rises over it; results open on a gold score ring
   COLOUR and TYPE: ISYS blue #005098 on deep navy #002b55, gold #f0d050 as the single accent, white surfaces; Nunito Sans echoing the logo's rounded wordmark
   LAYOUT: hero band, one floating card at 880px, generous air; stacks to one column under 600px */
:root{color-scheme:light dark;--bg:light-dark(#f3f6fa,#05162a);--surface:light-dark(#ffffff,#0b223d);--ink:light-dark(#1d2836,#e9eff7);--mute:light-dark(#5b6879,#9fb1c7);--rule:light-dark(#e2e8f0,#1b3a5e);--blue:light-dark(#005098,#6aa9ec);--teal:var(--blue);--deep:#002b55;--gold:#f0d050;--goldink:light-dark(#8f7200,#f0d050);--tealbg:light-dark(#edf4fc,#0f2c4f);--card:light-dark(#f7f9fc,#0e2746);--crit:light-dark(#b3261e,#f08a82);--high:light-dark(#b35c00,#f0a65a);--med:light-dark(#8a7400,#d9c25a);--ok:var(--blue);--shadow:light-dark(0 1px 2px rgba(0,43,85,.06),0 0 0 transparent)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Nunito Sans",system-ui,sans-serif;overflow-x:clip}
.hero{position:relative;background:linear-gradient(150deg,#001c3a 0%,var(--deep) 45%,#00467f 100%);color:#fff;padding:18px max(5vw,16px) 96px;overflow:hidden}
.hero svg.net{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.hbar{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;max-width:880px;margin:0 auto}
.hbar img{height:clamp(64px,9vw,86px);width:auto;display:block}
.htag{position:relative;max-width:880px;margin:22px auto 0;font-size:15px;color:#cfe0f3;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.htag b{color:var(--gold);font-weight:700}
.hero .lnk{color:#fff}
main{position:relative;margin:-64px auto 0;max-width:880px;padding:0 max(3vw,12px) 40px}
.wrap{background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:clamp(22px,4vw,48px);box-shadow:0 20px 50px -24px rgba(0,43,85,.35)}
h1,h2,h3{font-family:"Nunito Sans",system-ui,sans-serif;font-weight:800;line-height:1.1;text-wrap:balance;margin:0 0 .45em;letter-spacing:-.01em}
h1{font-size:clamp(30px,4.6vw,44px);color:var(--ink)}h2{font-size:clamp(22px,3vw,28px);margin-top:1.6em}h3{font-size:19px}
p{max-width:66ch;margin:0 0 1em}.mute{color:var(--mute)}.small{font-size:14px}
fieldset{border:0;padding:0;margin:0 0 22px}legend{font-weight:700;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border:1px solid var(--rule);border-radius:22px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;transition:border-color .15s}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{min-height:48px;padding:10px 24px;border-radius:24px;border:1px solid var(--gold);background:var(--gold);color:#002b55;font:inherit;font-weight:800;cursor:pointer}
.btn.ghost{background:transparent;color:var(--blue);border-color:var(--blue);font-weight:700}.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.line{font-size:14px;color:var(--blue);font-weight:700;display:flex;align-items:center;gap:8px}.line::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px light-dark(#fbf2c8,#3b3410)}
.prog{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin:12px 0 24px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .5s}
.q{border-top:1px solid var(--rule);padding:20px 0}
.q p{font-weight:600;margin-bottom:12px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.5fr);gap:6px}
.scale button{min-height:48px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-weight:800;cursor:pointer}
.scale button:hover{border-color:var(--blue)}
.scale button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.scale .ns{font-weight:600;font-size:14px}.scale .ns[aria-pressed=true]{background:var(--gold);color:#002b55;border-color:var(--gold)}
.anch{display:flex;justify-content:space-between;gap:16px;font-size:13px;color:var(--mute);margin-top:6px}.anch span:last-child{text-align:right}
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;background:linear-gradient(150deg,#001c3a,var(--deep) 55%,#00467f);color:#fff;border-radius:16px;padding:22px 24px;margin:18px 0}
.ring{width:132px;height:132px}.ring text{font-family:"Nunito Sans",sans-serif}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.figs b{display:block;font-weight:800;font-size:clamp(22px,3.2vw,30px);line-height:1.15}.figs span{font-size:13px;color:#b9cde4}
.fig{position:relative;min-height:400px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--mute)}.legend i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:12px 8px;border-bottom:1px solid var(--rule);text-align:left}th{font-weight:700;font-size:13px;color:var(--mute)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sev{font-size:13px;font-weight:700;white-space:nowrap}.sev.c{color:var(--crit)}.sev.h{color:var(--high)}.sev.m{color:var(--med)}.sev.o{color:var(--ok)}
.bar{height:8px;background:var(--rule);border-radius:4px;position:relative;min-width:60px}.bar i{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:4px}.bar u{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;background:var(--goldink)}
.rec{border:1px solid var(--rule);border-radius:16px;padding:18px 20px;margin:14px 0;background:var(--card)}
.rec .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.rec .off{font-size:14px;border-top:1px solid var(--rule);padding-top:10px;margin-top:10px}
.road{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.road>div{background:var(--card);border-radius:14px;padding:14px 16px;border-top:4px solid var(--blue)}.road>div:first-child{border-top-color:var(--gold)}.road ul{padding-left:18px;margin:6px 0;font-size:15px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:12px}
input,select{display:block;width:100%;margin-top:4px;min-height:48px;padding:10px 14px;font:inherit;font-size:16px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px;font-size:13px;max-height:280px;overflow:auto}
.trust{background:var(--tealbg);border-radius:16px;padding:18px 20px;margin:18px 0 26px;border:1px solid light-dark(#d6e6f7,#1b3a5e)}.trust h3{margin-bottom:6px;color:var(--blue)}.trust ul{margin:0;padding-left:20px}.trust li{margin:4px 0}.trust li::marker{color:var(--goldink)}
.lnk{background:none;border:0;color:var(--blue);font:inherit;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;padding:0 4px;text-decoration:underline;text-underline-offset:3px}
.ask{font-size:14px;margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--tealbg)}.ask b{font-weight:700;color:var(--blue)}
.tg{display:flex;gap:10px;align-items:center;font-size:15px;margin:14px 0}.tg input{width:22px;min-height:22px;height:22px;margin:0;flex:none;accent-color:var(--blue)}
.note{font-size:13px;color:var(--mute);border-left:3px solid var(--gold);padding-left:12px;margin-top:28px}
footer{max-width:880px;margin:0 auto;padding:8px max(3vw,12px) 40px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mute)}
footer img{height:44px;width:auto;background:#fff;border-radius:8px;padding:4px 6px}
.bds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:8px}
.bd{text-align:left;border:1px solid var(--rule);border-radius:16px;background:var(--card);color:var(--ink);padding:16px 16px 14px;font:inherit;cursor:pointer;min-height:120px;display:flex;flex-direction:column;gap:4px;position:relative;transition:border-color .15s}
.bd:hover{border-color:var(--blue)}.bd b{font-size:22px;font-weight:800;letter-spacing:.02em;color:var(--blue)}.bd span{font-size:14px;font-weight:600}.bd em{font-style:normal;font-size:13px;color:var(--mute);margin-top:auto}
.bd[aria-pressed=true]{background:linear-gradient(150deg,#001c3a,var(--deep) 55%,#00467f);border-color:var(--deep);color:#fff}.bd[aria-pressed=true] b{color:var(--gold)}.bd[aria-pressed=true] em{color:#cfe0f3}
.bd[aria-pressed=true]::after{content:"✓";position:absolute;top:12px;right:14px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#002b55;font-weight:800;font-size:14px;display:grid;place-items:center}
legend.row{display:flex}
.bdsc{display:grid;gap:8px;margin-top:16px}.bdsc div{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 2.5em;gap:10px;align-items:center;font-size:14px}.bdsc small{color:#b9cde4}.bdsc i{height:8px;border-radius:4px;background:rgba(255,255,255,.15);position:relative}.bdsc u{position:absolute;inset:0 auto 0 0;background:var(--gold);border-radius:4px}.bdsc b{text-align:right;font-weight:800}
tr.grp td{background:var(--tealbg);color:var(--blue);font-weight:800;font-size:14px;padding:8px}
@media(max-width:600px){.bds{grid-template-columns:minmax(0,1fr)}.bd{min-height:0}.stack tr.grp td{padding-inline-start:8px}.stack tr.grp td::before{display:none}.bdsc div{grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 2.2em}}
.plat{margin-top:22px;border-top:1px solid var(--rule);padding-top:18px}.plat h3{margin-bottom:4px}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}.pl b{display:block;font-weight:700;font-size:15px}.pl span{display:block;font-size:13px;color:var(--mute)}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{min-height:40px;padding:6px 10px;border:1px solid var(--rule);border-radius:20px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.seg .sx[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}.seg .sb[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#002b55}.seg .sg[aria-pressed=true]{background:light-dark(#e3f1e8,#14352a);border-color:light-dark(#2e7d4f,#5fbf8a);color:light-dark(#1e5c38,#9ee0b8)}
.pp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.pc{background:var(--card);border-radius:14px;padding:14px 16px;border-top:4px solid var(--blue)}.pc.sb{border-top-color:var(--gold)}.pc.sg{border-top-color:light-dark(#2e7d4f,#5fbf8a)}.pc h3{display:flex;justify-content:space-between;margin-bottom:2px}.pc h3 span{font-size:14px;color:var(--mute)}.pc ul{padding-left:18px;margin:6px 0 0;font-size:14px}
@media(max-width:600px){.pl{grid-template-columns:minmax(0,1fr)}.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.seg button{padding:6px 4px;font-size:12.5px}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.net .g{animation:pulse 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.net .g{animation:none}.prog i{transition:none}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--rule)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute)}.stack td:empty{display:none}
.score{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}.figs{width:100%;gap:10px}.figs b{font-size:19px}.road,.grid2{grid-template-columns:minmax(0,1fr)}.scale{grid-template-columns:repeat(5,minmax(0,1fr))}.scale .ns{grid-column:1/-1}.fig{min-height:330px}.wrap{border-radius:16px}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

<h2>Gap analysis</h2><p class="mute small">Grouped by business domain and ranked by priority: the size of the gap, weighted up where it affects your stated priorities. The marker on each bar is the target.</p>
<div class="scroll"><table class="stack"><thead><tr><th>Focus area</th><th>Maturity</th><th class="n">Current</th><th class="n">Target</th><th>Gap</th></tr></thead><tbody>
${BD.map(b=>{const rows=by.filter(r=>r.d.bd===b.id);return rows.length?`<tr class="grp"><td colspan="5">${b.name} · ${b.sub}</td></tr>`+rows.map(r=>`<tr><td><b>${r.d.name}</b></td><td><div class="bar"><i style="width:${r.c/5*100}%"></i><u style="left:${r.t/5*100}%"></u></div></td><td class="n">${r.c.toFixed(1)}</td><td class="n">${r.t.toFixed(1)}</td><td><span class="sev ${r.s[0]}">${r.s[1]}${r.g>0?' · '+r.g.toFixed(1):''}</span></td></tr>`).join(''):''}).join('')}
</tbody></table></div>
${IT.length?`<h2>Your platform picture</h2><p class="mute small">From what you marked in each area. This is where ISYS can help first.</p><div class="pp">${[['b','Needs attention','Health check, support, upgrade or migration plan'],['x','Exploring','Briefing, demo or proof of concept'],['g','Working well','Optimization, renewal and lifecycle planning']].map(([c,t,h])=>{const L=itBy(c);return L.length?`<div class="pc s${c}"><h3>${t} <span>${L.length}</span></h3><p class="small mute">${h}</p><ul>${L.map(x=>`<li>${x.l} <span class="mute small">· ${x.d.name}</span></li>`).join('')}</ul></div>`:''}).join('')}</div>`:''}
<h2>Top recommendations</h2>
${top.length?top.map((r,i)=>`<div class="rec"><div class="hd"><h3>${i+1}. ${r.d.name} <span class="mute small">· ${bdName(r.d.bd)}</span></h3><span class="sev ${r.s[0]}">${r.s[1]} gap</span></div><p style="margin:0">${r.d.rec[r.tier]}</p>${itBy('b').filter(x=>x.a===r.d.id).length?`<p class="small" style="margin:8px 0 0"><b>Platforms needing attention:</b> ${itBy('b').filter(x=>x.a===r.d.id).map(x=>x.l).join(', ')}</p>`:''}<p class="ask"><b>To discuss with your team:</b> ${r.d.ask}</p>${r.u?`<p class="small mute" style="margin:6px 0 0">${r.u} answer${r.u>1?'s were':' was'} “not sure yet”. Finding out is a good first step, and the score may be better than shown.</p>`:''}<div class="off"><span class="mute">How ISYS can help: </span>${r.d.off}</div></div>`).join(''):'<p>No gaps against target in the areas you assessed. Focus on optimizing and measuring value.</p>'}
<h2>Roadmap</h2><div class="road">
<div><h3>Now · 0–3 months</h3><p class="small mute" style="margin:0">Assess and design</p><ul>${now.length?now.map(r=>`<li>${r.d.name}</li>`).join(''):'<li class="mute">No critical gaps</li>'}${un?'<li>Clarify the “not sure yet” areas</li>':''}${itBy('b').length?`<li>Health checks: ${itBy('b').map(x=>x.l).join(', ')}</li>`:''}</ul></div>
<div><h3>Next · 3–9 months</h3><p class="small mute" style="margin:0">Implement</p><ul>${next.length?next.map(r=>`<li>${r.d.name}</li>`).join(''):'<li class="mute">No high gaps</li>'}${itBy('x').length?`<li>Proofs of concept: ${itBy('x').map(x=>x.l).join(', ')}</li>`:''}</ul></div>
<div><h3>Later · 9–18 months</h3><p class="small mute" style="margin:0">Operate and optimize</p><ul>${later.map(r=>`<li>${r.d.name}${r.g===0?' (optimize)':''}</li>`).join('')||'<li class="mute">—</li>'}</ul></div></div>
<h2>Where would you like us to follow up?</h2>
<p class="mute">This step is optional. Pick only the topics you want to talk about. You choose what is included, you see it before it goes, and nothing is shared unless you send it.</p>
<fieldset><legend>Topics</legend><div class="chips">${(top.length?top:by).map((r,i)=>`<button type="button" class="chip" data-f="${r.d.id}" aria-pressed="${i<3}">${r.d.name}</button>`).join('')}</div></fieldset>
${itBy('b').length+itBy('x').length?`<fieldset><legend>Platforms</legend><div class="chips">${[...itBy('b'),...itBy('x')].map(x=>`<button type="button" class="chip" data-f="${x.k}" aria-pressed="true">${x.l}</button>`).join('')}</div></fieldset>`:''}
<label class="tg"><input type="checkbox" id="incs"> Also include my scores for these topics</label>
<fieldset><legend>How should we reach you?</legend><div class="chips">${['Email','Phone call','WhatsApp','I’ll contact ISYS myself'].map((x,i)=>`<button type="button" class="chip" data-c="${x}" aria-pressed="${i===0}">${x}</button>`).join('')}</div></fieldset>
<div class="grid2"><label>Name <span class="mute">(optional)</span><input id="nm" autocomplete="name"></label><label>Email or phone <span class="mute">(optional)</span><input id="ct" autocomplete="email"></label></div>
<button class="btn" id="prev">Preview what will be shared</button>
<div id="out"></div>
<div class="row" style="margin-top:22px"><button class="btn ghost" id="copy">Copy report for internal planning</button><button class="btn ghost" id="edit">Edit answers</button><button class="btn ghost" id="reset">Start over</button><span id="cmsg" class="small mute"></span></div>
<p class="note">This self-assessment is here to help your team think and plan. Results are indicative, based on your own answers, and are not a formal audit. For investment decisions, ISYS recommends confirming them in a full assessment with our consultants.</p>`;
if(radar){const s=document.getElementById('radar'),draw=()=>{const W=s.clientWidth,H=s.clientHeight,n=R.length,nar=W<520,cx=W/2,cy=H/2,Rr=Math.min(W,H)/2-(nar?36:72);if(Rr<40)return;
const pt=(i,v)=>{const a=i*2*Math.PI/n-Math.PI/2;return[cx+Rr*v/5*Math.cos(a),cy+Rr*v/5*Math.sin(a)]};
const poly=k=>R.map((r,i)=>pt(i,r[k]).map(x=>x.toFixed(1)).join(',')).join(' ');
let h=[1,2,3,4,5].map(v=>`<polygon points="${R.map((_,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke="var(--rule)"/>`).join('');
h+=R.map((_,i)=>{const[x,y]=pt(i,5);return`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--rule)"/>`}).join('');
h+=`<polygon points="${poly('t')}" fill="none" stroke="var(--goldink)" stroke-width="2" stroke-dasharray="6 4"/><polygon points="${poly('c')}" fill="var(--teal)" fill-opacity=".18" stroke="var(--teal)" stroke-width="2.5"/>`;
h+=R.map((r,i)=>{const[x,y]=pt(i,r.c);return`<circle cx="${x}" cy="${y}" r="3.5" fill="var(--teal)"/>`}).join('');
h+=R.map((r,i)=>{const[x,y]=pt(i,5.55),a=i*2*Math.PI/n-Math.PI/2,c=Math.cos(a),an=Math.abs(c)<.2?'middle':c>0?'start':'end';return`<text x="${x}" y="${y+4}" text-anchor="${an}" font-size="${nar?11:13}" fill="var(--mute)" font-family="Nunito Sans,sans-serif">${nar?r.d.short:r.d.name}</text>`}).join('');
s.innerHTML=h};const ro=new ResizeObserver(draw);ro.observe(s)}
const sum=()=>`ISYS readiness self-assessment (internal planning copy)\nIndustry: ${S.p.ind||'-'} | Size: ${S.p.size||'-'} | Market: ${S.p.reg||'-'}\nPriorities: ${S.p.pr.map(k=>PR.find(p=>p[0]===k)[1]).join(', ')||'-'}\nReadiness index: ${idx}/100 (${lvl})\n${sub.map(s=>`${s.b.name}: ${s.v}/100`).join(' | ')}\n\nGaps (current / target):\n${BD.map(b=>{const rows=by.filter(r=>r.d.bd===b.id);return rows.length?b.name+'\n'+rows.map(r=>`- ${r.d.name}: ${r.c.toFixed(1)} / ${r.t.toFixed(1)} — ${r.s[1]}`).join('\n'):''}).filter(Boolean).join('\n')}${IT.length?'\n\nPlatforms:\n'+[['b','Needs attention'],['x','Exploring'],['g','Working well']].map(([c,t])=>itBy(c).length?`${t}: ${itBy(c).map(x=>x.l).join(', ')}`:'').filter(Boolean).join('\n'):''}\n\nTop actions:\n${top.map((r,i)=>`${i+1}. ${r.d.name}: ${r.d.rec[r.tier]}`).join('\n')}`;
document.getElementById('prev').onclick=()=>{const v=id=>document.getElementById(id).value.trim(),ids=[...app.querySelectorAll('[data-f][aria-pressed=true]')].map(b=>b.dataset.f),how=app.querySelector('[data-c][aria-pressed=true]')?.dataset.c||'-',inc=document.getElementById('incs').checked;
if(!ids.length){document.getElementById('out').innerHTML='<p style="margin-top:14px">Choose at least one topic to preview a request.</p>';return}
const t=`Follow-up request from the ISYS readiness assessment\nTopics: ${ids.filter(id=>!id.includes(':')).map(id=>{const d=A.find(x=>x.id===id);return`${d.name} (${bdName(d.bd)})`}).join(', ')||'-'}\n${ids.some(id=>id.includes(':'))?'Platforms: '+ids.filter(id=>id.includes(':')).map(id=>{const x=IT.find(y=>y.k===id);return`${x.l} (${x.v==='b'?'needs attention':'exploring'})`}).join(', ')+'\n':''}${inc?'Scores (current / target):\n'+ids.filter(id=>!id.includes(':')).map(id=>{const r=R.find(x=>x.d.id===id);return`- ${r.d.name}: ${r.c.toFixed(1)} / ${r.t.toFixed(1)}`}).join('\n')+'\n':''}Preferred contact: ${how}${v('nm')?'\nName: '+v('nm'):''}${v('ct')?'\nContact: '+v('ct'):''}`;
document.getElementById('out').innerHTML=`<p style="margin-top:14px">This is everything that would be shared, nothing more. Your other answers stay on this device.</p><pre id="req">${esc(t)}</pre><p class="small mute">In the ISYS app a Send button shares exactly this text. In this preview, copy it and send it via <a href="https://isys.ai">isys.ai</a>.</p><button class="btn ghost" id="creq">Copy request</button>`;
document.getElementById('creq').onclick=()=>cp(t)};
const cp=t=>{navigator.clipboard.writeText(t).then(()=>msg('Copied'),()=>msg('Copy not available here'))},msg=t=>{document.getElementById('cmsg').textContent=t};
document.getElementById('copy').onclick=()=>cp(sum());
document.getElementById('edit').onclick=()=>{S.step='q';S.i=0;go()};
document.getElementById('reset').onclick=()=>{S=fresh();go()}}
function go(){save();window.scrollTo(0,0);S.step==='q'&&doms().length?quest():S.step==='r'&&doms().length?results():start()}
const net=document.getElementById('net');{let sd=7;const rnd=()=>(sd=(sd*9301+49297)%233280)/233280;const N=[...Array(34)].map(()=>[rnd()*100,rnd()*100,rnd()<.18]);let g='';N.forEach((a,i)=>N.slice(i+1).forEach(c=>{const d=Math.hypot((a[0]-c[0])*1.6,a[1]-c[1]);if(d<24)g+=`<line x1="${a[0]}%" y1="${a[1]}%" x2="${c[0]}%" y2="${c[1]}%" stroke="${a[2]&&c[2]?'#f0d050':'#5b9be0'}" stroke-opacity=".45" stroke-width="1"/>`}));N.forEach((a,i)=>g+=`<circle cx="${a[0]}%" cy="${a[1]}%" r="${a[2]?4:2.5}" fill="${a[2]?'#f0d050':'#7fb2ea'}"${a[2]?` class="g" style="animation-delay:${(i%5)*.8}s"`:''}/>`);net.innerHTML=g}
document.getElementById('wipe').onclick=()=>{try{localStorage.removeItem('isysA2');localStorage.removeItem('isysA')}catch(e){}S=fresh();start();window.scrollTo(0,0)};
const keep=f=>{const y=window.scrollY;f();save();window.scrollTo(0,y)};
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.f){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');return}
if(b.dataset.c){app.querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',x===b));return}
if(b.dataset.bd){const v=b.dataset.bd;if(S.doms.includes(v)){S.doms=S.doms.filter(x=>x!==v);S.sel=S.sel.filter(id=>A.find(a=>a.id===id).bd!==v)}else S.doms=BD.map(x=>x.id).filter(x=>x===v||S.doms.includes(x));keep(start);return}
if(b.dataset.all){const L=A.filter(a=>a.bd===b.dataset.all).map(a=>a.id),all=L.every(id=>S.sel.includes(id));S.sel=all?S.sel.filter(id=>!L.includes(id)):[...new Set([...S.sel,...L])];S.sel=A.map(a=>a.id).filter(id=>S.sel.includes(id));keep(start);return}
if(b.dataset.a){const v=b.dataset.a;S.sel=S.sel.includes(v)?S.sel.filter(x=>x!==v):A.map(a=>a.id).filter(id=>id===v||S.sel.includes(id));keep(start);return}
if(b.dataset.g){const g=b.dataset.g,v=b.dataset.v;if(g==='pr'){const a=S.p.pr;if(a.includes(v))a.splice(a.indexOf(v),1);else if(a.length<3)a.push(v)}else S.p[g]=S.p[g]===v?'':v;keep(start);return}
if(b.dataset.it){const k=b.dataset.it,v=b.dataset.s;if(S.it[k]===v)delete S.it[k];else S.it[k]=v;keep(quest);return}
if(b.dataset.n!==undefined){const d=doms()[S.i];S.a[d.id+'-'+b.dataset.k]=+b.dataset.n;keep(quest);return}
if(b.id==='go'){S.step='q';S.i=0;go()}
if(b.id==='demo'){S=fresh();S.p={ind:IND[0],size:'2,000 – 10,000',reg:'Egypt',pr:['ai','compliance','cx']};S.doms=['build','think','transact'];S.sel=['compute','storage','cloud','sdwan','aifactory','data','integ','obs','sec','ekyc','kiosk','cards'];const v=[4,3,3,4, 3,2,1,2, 2,1,1,2, 3,2,3,3, 2,1,1,1, 2,2,1,3, 3,2,2,1, 3,3,2,2, 2,2,0,1, 2,1, 1, 3,2,2, 3,2,3];let k=0;doms().forEach(d=>d.q.forEach((_,j)=>{S.a[d.id+'-'+j]=v[k++]??2}));Object.assign(S.it,{'compute:power':'b','compute:gpu':'x','compute:x86':'g','storage:flash':'g','storage:tape':'b','storage:cyber':'x','storage:bkp':'b','cloud:priv':'x','aifactory:agents':'x','aifactory:arabic':'x','data:db2':'g','data:lake':'x','integ:mq':'g','integ:api':'b','sec:siem':'b','sec:dam':'x'});S.step='r';go()}
if(b.id==='back'){if(S.i>0)S.i--;else S.step='start';go()}
if(b.id==='next'){if(S.i<doms().length-1)S.i++;else S.step='r';go()}});
go()
}
